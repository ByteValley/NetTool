name: Spotify 歌词布局兼容（iPad + Mac）
description: 独立布局兼容层，只清除 Spotify 歌词响应里的全屏动作，不修改歌词内容；适配 iPad/iPhone 与 Mac，可和 Spotify 多源歌词模块同时启用。
icon: https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/Spotify.png
mitm:
  hostnames:
    - spclient.wg.spotify.com
    - '*-spclient.spotify.com'
scriptings:
  - http_response:
      name: Spotify 歌词布局 JSON
      match: '^https?://(?:spclient\.wg|[\w-]+-spclient)\.spotify\.com(?::443)?/color-lyrics/v2/track/(?=[^#]*[?&]format=json(?:&|$))'
      script_url: https://raw.githubusercontent.com/ByteValley/NetTool/main/Beta/Scripts/Enhancement/Spotify.Lyrics.Layout.js
      body_required: true
      binary_body: false
      timeout: 5
      max_size: 2097152
      update_interval: 3600
  - http_response:
      name: Spotify 歌词布局 Protobuf
      match: '^https?://(?:spclient\.wg|[\w-]+-spclient)\.spotify\.com(?::443)?/color-lyrics/v2/track/(?![^#]*[?&]format=json(?:&|$))'
      script_url: https://raw.githubusercontent.com/ByteValley/NetTool/main/Beta/Scripts/Enhancement/Spotify.Lyrics.Layout.js
      body_required: true
      binary_body: true
      timeout: 5
      max_size: 2097152
      update_interval: 3600
