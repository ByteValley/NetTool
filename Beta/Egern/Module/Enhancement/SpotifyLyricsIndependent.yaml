name: Spotify歌词增强
description: 补充 Spotify 多源歌词，支持翻译、发音和简繁匹配；QQ 音乐优先，其次网易云音乐、LRCLIB。不使用持久化缓存，每首歌都执行歌词替换。
icon: https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/Spotify.png
mitm:
  hostnames:
    - spclient.wg.spotify.com
    - spclient.spotify.com
    - '*-spclient.spotify.com'
scriptings:
  - http_request:
      name: Spotify 多源歌词 metadata 刷新
      match: '^https?://(?:spclient(?:\.wg)?|[\w-]+-spclient)\.spotify\.com(?::443)?/metadata/\d+/track/(?:[a-fA-F0-9]{32}|[A-Za-z0-9]{22})(?:[/?]|$)'
      script_url: https://raw.githubusercontent.com/ByteValley/NetTool/e9581b40c8825691cf63e6f2c38abc8e3f291244/Beta/Scripts/Enhancement/Spotify.Lyrics.Metadata.Request.js
      timeout: 3
      update_interval: 3600
  - http_request:
      name: Spotify 多源歌词 CORS 预检
      match: '^https?://(?:spclient(?:\.wg)?|[\w-]+-spclient)\.spotify\.com(?::443)?/color-lyrics/v2/track/(?:[a-fA-F0-9]{32}|[A-Za-z0-9]{22})(?:[/?]|$)'
      script_url: https://raw.githubusercontent.com/ByteValley/NetTool/6b482f3345af17e283ab2c150d3d82af9606c40a/Beta/Scripts/Enhancement/Spotify.Lyrics.Preflight.Request.js
      timeout: 3
      update_interval: 3600
  - http_response:
      name: Spotify 多源歌词 JSON
      match: '^https?://(?:spclient(?:\.wg)?|[\w-]+-spclient)\.spotify\.com(?::443)?/color-lyrics/v2/track/(?:[a-fA-F0-9]{32}|[A-Za-z0-9]{22})(?=[^#]*[?&]format=json(?:&|$))'
      script_url: https://raw.githubusercontent.com/ByteValley/NetTool/9056ab6cc097e46ca4f11d5cda457ffb18cb6cf0/Beta/Scripts/Enhancement/Spotify.Lyrics.Independent.js
      body_required: true
      binary_body: false
      timeout: 10
      max_size: 2097152
      update_interval: 3600
  - http_response:
      name: Spotify 多源歌词 Protobuf
      match: '^https?://(?:spclient(?:\.wg)?|[\w-]+-spclient)\.spotify\.com(?::443)?/color-lyrics/v2/track/(?:[a-fA-F0-9]{32}|[A-Za-z0-9]{22})(?![^#]*[?&]format=json(?:&|$))'
      script_url: https://raw.githubusercontent.com/ByteValley/NetTool/9056ab6cc097e46ca4f11d5cda457ffb18cb6cf0/Beta/Scripts/Enhancement/Spotify.Lyrics.Independent.js
      body_required: true
      binary_body: true
      timeout: 10
      max_size: 2097152
      update_interval: 3600
  - http_response:
      name: Spotify 多源歌词 metadata
      match: '^https?://(?:spclient(?:\.wg)?|[\w-]+-spclient)\.spotify\.com(?::443)?/metadata/\d+/track/(?:[a-fA-F0-9]{32}|[A-Za-z0-9]{22})(?:[/?]|$)'
      script_url: https://raw.githubusercontent.com/ByteValley/NetTool/9056ab6cc097e46ca4f11d5cda457ffb18cb6cf0/Beta/Scripts/Enhancement/Spotify.Lyrics.Independent.js
      body_required: true
      binary_body: true
      timeout: 3
      max_size: 2097152
      update_interval: 3600
