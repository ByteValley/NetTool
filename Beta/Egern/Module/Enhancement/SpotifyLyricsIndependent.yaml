name: Spotify歌词增强
description: 补充 Spotify 多源歌词，支持翻译、发音和简繁匹配；QQ 音乐优先，其次网易云音乐、LRCLIB。不使用持久化缓存，每首歌都执行歌词替换。
icon: https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/Spotify.png
mitm:
  hostnames:
    - spclient.wg.spotify.com
    - spclient.spotify.com
    - '*-spclient.spotify.com'
scriptings:
  - http_request:
      name: Spotify 多源歌词 metadata 刷新
      match: '^https?://(?:spclient(?:\.wg)?|[\w-]+-spclient)\.spotify\.com(?::443)?/metadata/\d+/track/(?:[a-fA-F0-9]{32}|[A-Za-z0-9]{22})(?:[/?]|$)'
      script_url: https://raw.githubusercontent.com/ByteValley/NetTool/2012ecc23f03d5d630be63e5bfbed1f462da1880/Beta/Scripts/Enhancement/Spotify.Lyrics.Metadata.Request.js
      timeout: 3
      update_interval: 3600
  - http_request:
      name: Spotify 多源歌词 CORS 预检
      match: '^https?://(?:spclient(?:\.wg)?|[\w-]+-spclient)\.spotify\.com(?::443)?/color-lyrics/v2/track/(?:[a-fA-F0-9]{32}|[A-Za-z0-9]{22})(?:[/?]|$)'
      script_url: https://raw.githubusercontent.com/ByteValley/NetTool/f6b42b27157d515294aa170274b1dfb80c086e9b/Beta/Scripts/Enhancement/Spotify.Lyrics.Preflight.Request.js
      timeout: 3
      update_interval: 3600
  - http_response:
      name: Spotify 多源歌词 JSON
      match: '^https?://(?:spclient(?:\.wg)?|[\w-]+-spclient)\.spotify\.com(?::443)?/color-lyrics/v2/track/(?:[a-fA-F0-9]{32}|[A-Za-z0-9]{22})(?=[^#]*[?&]format=json(?:&|$))'
      script_url: https://raw.githubusercontent.com/ByteValley/NetTool/194be50f4368760b47ec7adef42c0a778c2bc411/Beta/Scripts/Enhancement/Spotify.Lyrics.Independent.js
      body_required: true
      binary_body: false
      timeout: 10
      max_size: 2097152
      update_interval: 3600
  - http_response:
      name: Spotify 多源歌词 Protobuf
      match: '^https?://(?:spclient(?:\.wg)?|[\w-]+-spclient)\.spotify\.com(?::443)?/color-lyrics/v2/track/(?:[a-fA-F0-9]{32}|[A-Za-z0-9]{22})(?![^#]*[?&]format=json(?:&|$))'
      script_url: https://raw.githubusercontent.com/ByteValley/NetTool/194be50f4368760b47ec7adef42c0a778c2bc411/Beta/Scripts/Enhancement/Spotify.Lyrics.Independent.js
      body_required: true
      binary_body: true
      timeout: 10
      max_size: 2097152
      update_interval: 3600
  - http_response:
      name: Spotify 多源歌词 metadata
      match: '^https?://(?:spclient(?:\.wg)?|[\w-]+-spclient)\.spotify\.com(?::443)?/metadata/\d+/track/(?:[a-fA-F0-9]{32}|[A-Za-z0-9]{22})(?:[/?]|$)'
      script_url: https://raw.githubusercontent.com/ByteValley/NetTool/194be50f4368760b47ec7adef42c0a778c2bc411/Beta/Scripts/Enhancement/Spotify.Lyrics.Independent.js
      body_required: true
      binary_body: true
      timeout: 3
      max_size: 2097152
      update_interval: 3600
