name: 字节净化
description: 按域名精细拦截字节系广告（蛋花 / 番茄 / 头条 / 抖音内嵌），屏蔽开屏 / 激励 / 前贴片及埋点，兼容短剧播放。
author: ByteValley
icon: https://gitlab.com/lodepuly/iconlibrary/-/raw/main/App_icon/120px/DragonRead.png
dns: {}
rules:
- and:
    match:
    - or:
        match:
        - domain_suffix:
            match: douyin.com
        - domain_suffix:
            match: zijieapi.com
        - domain_suffix:
            match: snssdk.com
        - domain_suffix:
            match: toutiaoapi.com
        - domain_suffix:
            match: fqnovel.com
        - domain_suffix:
            match: fqnovelvod.com
    - or:
        match:
        - domain_keyword:
            match: -lf
        - domain_keyword:
            match: -lq
        - domain_keyword:
            match: -hl
    policy: REJECT-DROP
