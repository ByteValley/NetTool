name: Spotify 多源补词
description: LRCLIB + 网易云；仅处理歌词接口 404；需要 Egern 原生 ctx 脚本 API
icon: https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/Spotify.png
mitm:
  hostnames:
    - spclient.wg.spotify.com
    - '*.spclient.spotify.com'
scriptings:
  - http_response:
      name: Spotify Lyrics Fallback
      match: '^https://(?:spclient\.wg\.spotify\.com|[\w-]+\.spclient\.spotify\.com)/color-lyrics/v2/track/'
      script_url: https://raw.githubusercontent.com/ByteValley/NetTool/main/Scripts/Enhancement/spotify-lyrics.js
      body_required: true
      binary_body: true
      timeout: 25
      max_size: 2097152
