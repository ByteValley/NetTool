name: Spotify 多源歌词
description: 独立补词，无翻译。网易云、QQ、LRCLIB 并发检索，支持简繁匹配和歌词缓存。日志显示歌名、歌手、来源与耗时。
icon: https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/Spotify.png
mitm:
  hostnames:
    - spclient.wg.spotify.com
    - '*-spclient.spotify.com'
scriptings:
  - http_response:
      name: Spotify 多源歌词 v3.1 JSON
      match: '^https?://(?:spclient\.wg|[\w-]+-spclient)\.spotify\.com(?::443)?/color-lyrics/v2/track/(?=[^#]*[?&]format=json(?:&|$))'
      script_url: https://raw.githubusercontent.com/ByteValley/NetTool/main/Scripts/Enhancement/Spotify.Lyrics.Independent.js?v=3.1
      body_required: true
      binary_body: false
      timeout: 10
      max_size: 2097152
      update_interval: 3600
  - http_response:
      name: Spotify 多源歌词 v3.1 Protobuf
      match: '^https?://(?:spclient\.wg|[\w-]+-spclient)\.spotify\.com(?::443)?/color-lyrics/v2/track/(?![^#]*[?&]format=json(?:&|$))'
      script_url: https://raw.githubusercontent.com/ByteValley/NetTool/main/Scripts/Enhancement/Spotify.Lyrics.Independent.js?v=3.1
      body_required: true
      binary_body: true
      timeout: 10
      max_size: 2097152
      update_interval: 3600
