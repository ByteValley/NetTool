name: 中国移动组件服务
description: 查询套餐内通话、套餐使用情况
author: ByteValley
homepage: https://github.com/ByteValley/NetTool
env_schema:
  CHINA_MOBILE_PHONENUMBER:
    name: 手机号码
    description: 留空时使用脚本中已保存的账号
    default_value: ""
  CHINA_MOBILE_BARK_KEY:
    name: Bark Key
    description: 填写后使用 Bark 推送
    default_value: ""
  CHINA_MOBILE_DEBUG:
    name: 调试模式
    options:
      - "0"
      - "1"
  CHINA_MOBILE_SILENT:
    name: 静默模式
    options:
      - "0"
      - "1"
dns: {}
scriptings:
  - http_request:
      name: 移动参数获取
      match: ^https?:\\/\\/client\\.app\\.coc\\.10086\\.cn\\/biz-orange\\/[LD]N\\/(uam(onekey|randcode)login|realPersonAuthentication)\\/autoLogin
      script_url: https://raw.githubusercontent.com/ByteValley/NetTool/main/Scripts/Component/10086.patched.js
      max_size: 0
      body_required: true
  - http_request:
      name: 移动余量查询·组件
      match: ^https?:\\/\\/api\\.example\\.com\\/10086\\/query
      script_url: https://github.com/ChinaTelecomOperators/ChinaMobile/releases/download/Prerelease-Alpha/10086.js
      max_size: -1
      timeout: 60
      body_required: true
mitm:
  hostnames:
    includes:
      - api.example.com
      - client.app.coc.10086.cn
